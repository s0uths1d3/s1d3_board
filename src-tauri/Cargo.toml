[package]
name = "s1d3_board"
version = "0.4.0"
description = "Lightweight tray-resident productivity panel: clipboard, todos, notes & app stats. Local-first, Rust-powered, one shortcut away."
authors = ["s1d3"]
license = "Apache-2.0 license"
repository = "https://github.com/s0uths1d3/s1d3_board"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "image-ico"] }
# 智能剪贴板 AI 通道（设计文档 §4.2）：Rust 侧代理调用 AI API（OpenAI 兼容 / Anthropic 原生 / 自定义 JSON 模板），
# 前端不直接 fetch：CSP 无需放宽任意域名、API Key 不暴露给 WebView；rustls 跨平台无系统依赖
# stream + futures-util：自定义模式 SSE 流式响应解析（bytes_stream）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# 灵动岛 Webhook 出站推送：X-S1d3-Signature 签名头（HMAC-SHA256，hex 编码手写无 hex 依赖）
hmac = "0.12"
sha2 = "0.10"
# Webhook URL 白名单校验（https 任意 / http 仅回环）；reqwest 同源依赖
url = "2"
# Webhook 重试退避定时器（tauri 内部同为 tokio 1.x，版本一致零额外成本）
tokio = { version = "1", features = ["time"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard = "2.1.11"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
enigo = "0.5.0"
tauri-plugin-notification = "2"
# 灵动岛历史导出：save 对话框选路径（选中路径自动进 fs scope）+ 文本文件写入
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 应用图标提取：PNG 编码（Windows HICON 转码 / Linux 主题图标转码）与 base64 数据 URL
# jpeg/bmp/gift：剪贴板图片二维码补解码（clipboard_qr_from_data_url）按真实字节嗅探格式，
# 剪贴板图片可能是其他应用写入的 JPEG/BMP（data URL 前缀统一写 png 不可信）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
base64 = "0.22"
# 二维码识别（quircs：C 库 quirc 的 Rust 绑定，cc 编译）：复制图片时从像素解码 QR 链接
# （环盘/灵动岛展示）。选型：quirc 是 Android 等主流扫描器的识别引擎，对 Logo 遮挡码
# （微信/QQ 群二维码）的网格检测与纠错解码比 rqrr 更强；输入为 1 字节/像素灰度缓冲
quircs = "0.10"

# 二维码识别单元测试：生成测试用 QR 图片（仅 cargo test 编译进测试二进制，不影响产物）；
# 其 image 依赖同为 0.25 与工程统一
[dev-dependencies]
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
] }

# 应用使用时长：macOS 前台应用名/图标与切换通知（AppKit）
[target.'cfg(target_os = "macos")'.dependencies]
# objc2 直接依赖：macos.rs 需要 AnyThread trait（NSBitmapImageRep::alloc）
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "NSData", "NSDictionary", "block2"] }
block2 = "0.6"

# 应用使用时长：Linux X11 前台窗口与屏保空闲（纯 Rust 实现，无需系统库链接）
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[dependencies.tauri-plugin-sql]
features = ["sqlite"] # or "postgres", or "mysql"
version = "2.4.0"
