name: Build and Attach to Release

# 多平台构建 Tauri 安装包并上传到对应 Release
# 使用方式：
#   1. 推送 tag（如 git tag x.y.z && git push origin x.y.z）
#   2. 在 GitHub Actions 页面手动触发（workflow_dispatch，输入 tag 名），
#      或 tag 命中 push 事件自动触发
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并上传到的 Release tag 名称（需已推送）'
        required: true
  push:
    tags:
      - 'v*'
      - 's1d3_board_*'

# 允许 GITHUB_TOKEN 创建/更新 Release 与上传 artifacts（默认只读，会 403）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nuxt 4.x 要求 Node >= 22.19
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      # 使用 npm install 而非 npm ci：本地（Node 24）生成的 lock 与 CI（Node 22）的
      # hoisting 决策不一致时 npm ci 会严格报 "Missing: xxx from lock file"。
      # npm install 按 package.json 解析并自动修正 lock 差异，保证可构建。
      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run generate

      - name: Build Tauri application
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          # 通过 env 传入输入值，避免未校验的输入直接内插进 shell（script injection 面）
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # Release 说明：读取 CHANGELOG.md 中「未发布」小节；无该小节时使用完整文件。
          # softprops 要求 body_path 指向已存在文件，这里始终传 CHANGELOG.md。
          body_path: CHANGELOG.md
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
